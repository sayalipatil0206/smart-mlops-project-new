name: MLOps CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train a model for API tests
        run: python -m src.train

      - name: Run automated tests
        run: python -m pytest --cov=src --cov-report=term-missing
      
      - name: Build Docker image
        run: docker build -t smart-mlops-api .

      - name: Run Docker container
        run: docker run -d --name smart-mlops-test -p 8000:8000 smart-mlops-api

      - name: Check container health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8000/health; then
              docker stop smart-mlops-test
              exit 0
            fi
            sleep 3
          done
          docker logs smart-mlops-test
          exit 1